name: Galileo Technology
description: 'Galileo Technology was a fabless semiconductor company founded in 1993
  that designed and marketed complex semiconductor devices for high-performance embedded
  control systems, principally in the area of data communications. Co-founded by Avigdor
  Willenz (CEO), Manuel Alba (President), and Eyal Waldman (VP Engineering), the company
  completed an IPO in 2000 and was acquired by Marvell Technology, Inc. in 2001 for
  approximately $2.7 billion. It was an early Lightspeed Venture Partners investment
  (1995). The company no longer operates independently and exposes no public developer
  surface, API, or documentation; this profile is retained for network/portfolio lineage
  only.'
